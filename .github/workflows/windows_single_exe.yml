name: Build Single EXE for Windows
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Bundle tools, books and VC++ runtime
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path "$out\tools", "$out\books" | Out-Null
          if (Test-Path "books_bundle") { Copy-Item "books_bundle\*.epub" "$out\books\" -ErrorAction SilentlyContinue }
          Copy-Item "C:\Windows\System32\vcruntime140*.dll" "$out\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\msvcp140*.dll" "$out\" -ErrorAction SilentlyContinue
          $gh = "https://" + "github.com"
          Invoke-WebRequest -Uri "$gh/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$out\tools\yt-dlp.exe"
          choco install mpvio -y --no-progress
          $mpvDir = (Get-Command mpv.exe).Source | Split-Path
          Copy-Item "$mpvDir\mpv.exe" "$out\tools\mpv.exe"
          Copy-Item "$mpvDir\*.dll" "$out\tools\" -ErrorAction SilentlyContinue
      - name: Build Windows Installer
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=ZenTemple
          AppVersion=1.0.0
          DefaultDirName={localappdata}\Programs\ZenTemple
          DefaultGroupName=ZenTemple
          OutputDir=.
          OutputBaseFilename=ZenTemple_Setup
          SetupIconFile=windows\runner\resources\app_icon.ico
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{userdesktop}\ZenTemple"; Filename: "{app}\zen_temple.exe"; WorkingDir: "{app}"
          Name: "{userprograms}\ZenTemple"; Filename: "{app}\zen_temple.exe"; WorkingDir: "{app}"
          [Run]
          Filename: "{app}\zen_temple.exe"; Description: "Launch ZenTemple"; Flags: nowait postinstall skipifsilent
          "@
          [System.IO.File]::WriteAllText("installer.iss", $iss, [System.Text.UTF8Encoding]::new($true))
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ZenTemple-Windows-Installer
          path: ZenTemple_Setup.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ZenTemple v1.0.${{ github.run_number }}
          files: ZenTemple_Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev mpv
      - name: Build Linux Release
        run: flutter build linux --release
      - name: Package .deb installer
        run: |
          mkdir -p pkg/usr/local/bin/zen_temple_app pkg/usr/share/applications pkg/DEBIAN
          cp -r build/linux/x64/release/bundle/* pkg/usr/local/bin/zen_temple_app/
          printf '#!/bin/sh\nexec /usr/local/bin/zen_temple_app/zen_temple "$@"\n' > pkg/usr/local/bin/zen_temple
          chmod +x pkg/usr/local/bin/zen_temple
          printf '[Desktop Entry]\nName=ZenTemple\nExec=/usr/local/bin/zen_temple\nType=Application\nCategories=AudioVideo;Education;\n' > pkg/usr/share/applications/zentemple.desktop
          printf 'Package: zentemple\nVersion: 1.0.0\nSection: utils\nPriority: optional\nArchitecture: amd64\nDepends: mpv, yt-dlp, libgtk-3-0\nMaintainer: gerter1985\nDescription: Zen Temple Library and Media Player\n' > pkg/DEBIAN/control
          dpkg-deb --build pkg ZenTemple_Linux_amd64.deb
      - name: Upload Linux .deb to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: ZenTemple_Linux_amd64.deb

  build-om-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: om_mantra
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build OM Windows
        run: flutter build windows --release
      - name: Package OM_Setup.exe
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path "$out\tools" | Out-Null
          Copy-Item "C:\Windows\System32\vcruntime140*.dll" "$out\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\msvcp140*.dll" "$out\" -ErrorAction SilentlyContinue
          $gh = "https://" + "github.com"
          Invoke-WebRequest -Uri "$gh/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$out\tools\yt-dlp.exe"
          $iss = @"
          [Setup]
          AppName=OM Mantra
          AppPublisher=Yevhen Herter
          AppVersion=1.0.3
          DefaultDirName={localappdata}\Programs\OM_Mantra
          DefaultGroupName=OM Mantra
          OutputDir=.
          OutputBaseFilename=OM_Setup
          SetupIconFile=windows\runner\resources\app_icon.ico
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{userdesktop}\OM Mantra"; Filename: "{app}\om_mantra.exe"; WorkingDir: "{app}"
          Name: "{userprograms}\OM Mantra"; Filename: "{app}\om_mantra.exe"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\om_mantra.exe"; Description: "Launch OM"; Flags: nowait postinstall skipifsilent
          "@
          [System.IO.File]::WriteAllText("installer.iss", $iss, [System.Text.UTF8Encoding]::new($true))
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Release OM_Setup.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: om_mantra/OM_Setup.exe

  build-om-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: om_mantra
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build OM Linux .deb
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev mpv
          flutter build linux --release
          mkdir -p pkg/usr/local/bin/om_mantra_app pkg/usr/share/applications pkg/usr/share/icons/hicolor/256x256/apps pkg/DEBIAN
          cp -r build/linux/x64/release/bundle/* pkg/usr/local/bin/om_mantra_app/
          cp assets/om_icon.png pkg/usr/share/icons/hicolor/256x256/apps/om_mantra.png
          printf '#!/bin/sh\nexec /usr/local/bin/om_mantra_app/om_mantra "$@"\n' > pkg/usr/local/bin/om_mantra
          chmod +x pkg/usr/local/bin/om_mantra
          printf '[Desktop Entry]\nName=ОМ • Мантра Медитація\nComment=Автор проєкту: Євген Гертер\nExec=/usr/local/bin/om_mantra\nIcon=om_mantra\nType=Application\nCategories=AudioVideo;Education;\n' > pkg/usr/share/applications/om_mantra.desktop
          printf 'Package: om-mantra\nVersion: 1.0.3\nSection: utils\nPriority: optional\nArchitecture: amd64\nDepends: mpv, yt-dlp, libgtk-3-0\nMaintainer: Yevhen Herter\nDescription: OM Mantra Meditation by Yevhen Herter\n' > pkg/DEBIAN/control
          dpkg-deb --build pkg OM_Linux_amd64.deb
      - name: Release OM_Linux_amd64.deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: om_mantra/OM_Linux_amd64.deb
