name: Build Single EXE for Windows
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Bundle tools and books
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path "$out\tools", "$out\books" | Out-Null
          if (Test-Path "books_bundle") { Copy-Item "books_bundle\*.epub" "$out\books\" -ErrorAction SilentlyContinue }
          $gh = "https://" + "github.com"
          Invoke-WebRequest -Uri "$gh/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$out\tools\yt-dlp.exe"
          choco install mpvio -y --no-progress
          $mpvDir = (Get-Command mpv.exe).Source | Split-Path
          Copy-Item "$mpvDir\mpv.exe" "$out\tools\mpv.exe"
          Copy-Item "$mpvDir\*.dll" "$out\tools\" -ErrorAction SilentlyContinue
      - name: Pack into Single Portable EXE with Icon
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          $gh = "https://" + "github.com"
          7z a -mx=5 app.7z "$out\*"
          Copy-Item "C:\Program Files\7-Zip\7z.sfx" "7zSD.sfx"
          Invoke-WebRequest -Uri "$gh/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile "rcedit.exe"
          .\rcedit.exe "7zSD.sfx" --set-icon "windows\runner\resources\app_icon.ico"
          $cfg = ';!@Install@!UTF-8!' + "`r`n" + 'RunProgram="zen_temple.exe"' + "`r`n" + 'GUIMode="2"' + "`r`n" + ';!@InstallEnd@!' + "`r`n"
          [System.IO.File]::WriteAllText("config.txt", $cfg, [System.Text.UTF8Encoding]::new($false))
          cmd /c copy /b 7zSD.sfx + config.txt + app.7z ZenTemple.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ZenTemple-Windows-Single-EXE
          path: ZenTemple.exe
